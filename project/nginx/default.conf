map $http_x_req_id $req_id {
    default $http_x_req_id;
    ""      $request_id;
}

log_format detector escape=json
'{"ts":"$time_iso8601","id":"$req_id","ip":"$remote_addr",'
'"method":"$request_method","uri":"$request_uri","proto":"$server_protocol",'
'"ua":"$http_user_agent","body":"$request_body","status":$status,"response_size":$body_bytes_sent}';

server {
    listen 80;

    access_log /var/log/detector/detector.log detector;

    location / {
        proxy_pass http://bookstack:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_body_buffer_size 64k;      # si el body es mayor, $request_body queda vacio
    }
}