services:
  bookstack-db:
    image: mariadb:11
    container_name: bookstack-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./bookstack_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  bookstack:
    image: lscr.io/linuxserver/bookstack:26.09.2
    container_name: bookstack
    restart: unless-stopped
    depends_on:
      bookstack-db:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_URL=${APP_URL}
      - APP_KEY=${APP_KEY}
      - APP_PROXIES=*                          # confia en las cabeceras X-Forwarded-* de nginx
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./bookstack_config:/config
    expose:
      - "80"                                   # solo visible dentro de la red de Docker, no se publica al host

  nginx:
    image: nginx:stable
    container_name: nginx-proxy
    depends_on:
      - bookstack
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"           # unica entrada: solo tu maquina
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/detector               # aqui nginx escribe detector.log (fuente de verdad)

  ollama:
    image: ollama/ollama:0.40.15
    container_name: ollama
    restart: unless-stopped
    init: true                                 # cierre limpio de los procesos al hacer docker compose down
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_KEEP_ALIVE=24h                  # mantiene el modelo cargado entre peticiones
      - OLLAMA_NUM_PARALLEL=1                  # una consulta a la vez: tiempos comparables
    volumes:
      - ./ollama_models:/root/.ollama          # los modelos se descargan una sola vez
    expose:
      - "11434"                                # solo visible dentro de la red de Docker
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull $${OLLAMA_MODEL}
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL}\""]   # sano = modelo ya descargado
      interval: 10s
      timeout: 5s
      retries: 90                              # hasta ~15 min para la primera descarga
      start_period: 20s

  detector:
    build: ./detector                          # usa detector/Dockerfile (pip install -r requirements.txt)
    container_name: detector
    depends_on:
      nginx:
        condition: service_started
      ollama:
        condition: service_healthy             # espera a que el modelo este descargado
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    volumes:
      - ./logs:/var/log/detector:ro            # solo lectura: el detector nunca escribe el log
      # - ./models:/app/models:ro              # futuro: aqui van los .pkl entrenados en Colab
      # -n 0 = solo lineas nuevas. Para reprocesar todo el log (replay) usa: -n +1
    command: sh -c "tail -F -n 0 /var/log/detector/detector.log | python detector.py"