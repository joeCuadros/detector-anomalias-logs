services:
  bookstack-db:
    image: mariadb:11
    container_name: bookstack-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ}
    volumes:
      - bookstack_db:/var/lib/mysql            # volumen de Docker: en una carpeta de Windows InnoDB no crea sus tablas
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  bookstack:
    image: lscr.io/linuxserver/bookstack:26.09.2
    container_name: bookstack
    restart: unless-stopped
    depends_on:
      bookstack-db:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_URL=${APP_URL}
      - APP_KEY=${APP_KEY}
      - APP_PROXIES=*                          # confia en las cabeceras X-Forwarded-* de nginx
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./bookstack_config:/config
    expose:
      - "80"                                   # solo visible dentro de la red de Docker, no se publica al host

  nginx:
    image: nginx:stable
    container_name: nginx-proxy
    depends_on:
      - bookstack
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"           # unica entrada: solo tu maquina
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/detector               # aqui nginx escribe detector.log (fuente de verdad)

  # El LLM corre en el host con llama-server (acceso directo a la GPU); ver .env.example
  detector:
    build: ./detector                          # usa detector/Dockerfile (pip install -r requirements.txt)
    container_name: detector
    depends_on:
      nginx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"    # permite llegar a llama-server en el host
    environment:
      - PYTHONUNBUFFERED=1
      - MODO=${MODO}
      - UMBRAL_ML=${UMBRAL_ML}
      - LLM_URL=${LLM_URL}
      - LLM_NOMBRE=${LLM_NOMBRE}
      - EVENTOS=/app/eventos/eventos.jsonl     # lo lee el panel web; quita la linea para desactivarlo
    volumes:
      - ./logs:/var/log/detector:ro            # solo lectura: el detector nunca escribe el log
      - ./panel_datos:/app/eventos             # eventos para el panel
      # - ./models:/app/models:ro              # futuro: aqui van los .pkl entrenados en Colab
      # -n 0 = solo lineas nuevas. Para reprocesar todo el log (replay) usa: -n +1
    command: sh -c "tail -F -n 0 /var/log/detector/detector.log | python detector.py"

  # Panel web en vivo: http://127.0.0.1:8090
  panel:
    image: python:3.12-slim
    container_name: panel
    restart: unless-stopped
    working_dir: /panel
    command: python servidor.py
    environment:
      - EVENTOS=/datos/eventos.jsonl
    volumes:
      - ./panel:/panel:ro
      - ./panel_datos:/datos:ro
    ports:
      - "127.0.0.1:8090:8090"                  # solo tu maquina

volumes:
  bookstack_db:
